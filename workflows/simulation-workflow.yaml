apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: simulation-workflow-
  namespace: argo
spec:
  entrypoint: simulation
  templates:
  - name: simulation
    container:
      image: ubuntu:latest
      command: [bash, -c]
      args: ["echo 'Starting simulation...'; sleep 15; echo 'Simulation complete.'"]
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
